<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Civitech Planning</title><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Civitech Planning"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: schermata unica scura per il lavoro in furgone. Barra alta fissa con schede Oggi / Archivio, riepilogo incassi in cima, elenco schede a colonna singola. */
:root {
  --bg: #ffffff;
  --surface: #f4f6f8;
  --raised: #e8ecf0;
  --line: #d3d9df;
  --fg: #14191e;
  --muted: #5d6874;
  --accent: #d9820f;
  --accent-ink: #ffffff;
  --cash: #1f8a3b;
  --pos: #1d6fc4;
  --danger: #d42a1c;
  --info: #1555c0;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
  background: var(--bg);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--f-body);
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }

/* splash */
#splash {
  position: fixed; inset: 0; z-index: 50; background: #fff; color: #14191e;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  text-align: center; cursor: pointer; border: 0; width: 100%;
  transition: opacity .45s ease;
}
#splash.out { opacity: 0; pointer-events: none; }
#splash .s1 { font: 700 clamp(44px, 16vw, 84px)/0.95 var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
#splash .s2 { font: 600 clamp(20px, 7vw, 34px)/1 var(--f-display); letter-spacing: .5em; text-transform: uppercase; color: var(--accent); margin-right: -.5em; }
#splash .bar { width: 64px; height: 3px; background: var(--accent); margin: 6px 0; }
#splash .s3 { font-size: 13px; color: #6b7480; letter-spacing: .08em; text-transform: uppercase; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; padding-bottom: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font: 700 26px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand .when { color: var(--muted); font-size: 13px; text-align: right; min-width: 0; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tabs button {
  min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font: 600 15px var(--f-body); color: var(--muted);
}
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.back { align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

main { padding-top: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* totals */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sum .tot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
.sum .tot .v { font-size: 34px; }
.sum .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sum .v { font: 600 24px/1.1 var(--f-display); margin-top: 2px; overflow-wrap: anywhere; }
.sum .v.cash { color: var(--cash); }
.sum .v.pos { color: var(--pos); }
.sum .v.bol { color: var(--accent); }
.sum .meta { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.sum .meta .c-done { color: var(--cash); font-weight: 600; }
.sum .meta .c-todo { color: var(--danger); font-weight: 600; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--raised); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.danger.on { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg, .ico { width: 18px; height: 18px; flex: none; }
.dateline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.dateline input { min-height: 38px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; color-scheme: light; }

/* progress */
.busy { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.busy .t { font-weight: 600; }
.track { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

/* alerts */
.alerts { background: #fff4e0; border: 1px solid #e5b66b; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.alerts h2 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.alerts p { margin: 0; color: #6b5420; font-size: 13px; }
.al { background: #fff; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.al b { font-weight: 600; }
.diff { font-size: 14px; overflow-wrap: anywhere; }
.diff s { color: var(--muted); }
.diff em { font-style: normal; color: var(--accent); }
.al .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.al .btn { min-height: 40px; font-size: 14px; }

/* cards */
.list { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card .body { display: flex; flex-direction: column; }
.card.void .body { opacity: .45; }
.head { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 12px 8px; }
.ord { font: 700 30px/1 var(--f-display); color: var(--accent); text-align: center; }
.nm { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; }
.card.open .chev { transform: rotate(180deg); }
.badge { font: 600 11px var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.badge.man { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.lines { padding: 0 12px 8px 62px; display: flex; flex-direction: column; gap: 6px; }
.line { display: flex; align-items: flex-start; gap: 8px; min-height: 34px; text-decoration: none; color: var(--fg); overflow-wrap: anywhere; }
.line .ico { margin-top: 2px; color: var(--accent); }
.line.miss { color: var(--muted); }
.line .txt { min-width: 0; }
.line-tel { display: flex; align-items: center; gap: 8px; }
.line-tel .line { flex: 1; min-width: 0; }
.mini { min-height: 34px; min-width: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); display: inline-flex; align-items: center; justify-content: center; }
.mini svg { width: 16px; height: 16px; }
.savebar { padding: 0 12px 12px; }
.savebar .btn { width: 100%; }
.quick { padding: 2px 12px 10px 62px; display: flex; flex-direction: column; gap: 4px; }
.quick label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.quick textarea { min-height: 56px; }
.nm span[id^="h-nome"] { color: var(--info); }
.line:not(.miss), .line:not(.miss) .ico { color: var(--info); }
.line-tel .line .txt { font-weight: 500; }
.note-prev { padding: 0 12px 8px 62px; color: var(--muted); font-size: 13px; font-style: italic; overflow-wrap: anywhere; }
.pay { padding: 8px 12px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: #cfd6dd; color: var(--fg); border-color: #9aa5b0; }
.seg button.on.cash { background: var(--cash); color: #fff; border-color: var(--cash); }
.seg button.on.pos { background: var(--pos); color: #fff; border-color: var(--pos); }
.amt { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.amt input { flex: 1; min-width: 0; }
.ro-pay { color: var(--muted); font-size: 14px; }
.ro-pay b { color: var(--fg); }
.stamp {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg);
  font: 700 clamp(22px, 7.4vw, 34px)/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  color: var(--danger); border: 3px solid var(--danger); border-radius: 6px; padding: 6px 12px;
  white-space: nowrap; pointer-events: none; background: rgba(255,255,255,.8);
}

/* forms */
.form { padding: 4px 12px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; grid-column: span 6; }
.fld.h { grid-column: span 3; }
.fld.w4 { grid-column: span 4; }
.fld.w2 { grid-column: span 2; }
.fld label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=tel], input[type=date], textarea, .amt input {
  width: 100%; min-height: 44px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px;
}
textarea { min-height: 76px; resize: vertical; }
.noterow { display: flex; gap: 8px; align-items: flex-start; }
.noterow textarea { flex: 1; min-width: 0; }
.mic.on { background: var(--danger); color: #fff; border-color: var(--danger); }
.form .btns { grid-column: span 6; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
.dl { margin: 0; padding: 4px 12px 14px 62px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 14px; }
.dl div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; overflow-wrap: anywhere; }

/* empty + archive */
.empty { border: 1px dashed #b4bdc6; border-radius: 12px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h2 { margin: 0; font: 700 26px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.search { display: flex; flex-direction: column; gap: 6px; }
.search label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.arch-list { display: flex; flex-direction: column; gap: 8px; }
.arch { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.arch .d { font-weight: 600; text-transform: capitalize; }
.arch .m { color: var(--muted); font-size: 13px; }
.arch .m .c { color: var(--cash); }
.arch .m .p { color: var(--pos); }
.hit .d { text-transform: none; }
.ro-banner { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ro-banner b { text-transform: capitalize; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }

/* preventivi */
.prev { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.prev[hidden] { display: none; }
.pv-top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
.pv-top h2 { margin: 0; font: 700 22px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.pv-top .btn { min-height: 40px; }
.pv-body { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; padding-bottom: 24px; }
.pv-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pv-row[hidden], .pv-sel[hidden] { display: none; }
.pv-row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pv-row3 .btn { padding: 0 6px; font-size: 14px; }
.pv-pick { position: relative; overflow: hidden; text-align: center; }
.pv-pick input[type=file] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; font-size: 100px; }
#pv-cv { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); touch-action: none; user-select: none; -webkit-user-select: none; }
.pv-hint { color: var(--muted); font-size: 13px; min-height: 18px; }
.pv-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pv-tools button { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 14px; }
.pv-tools button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.pv-tools .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.pv-sel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pv-sel label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pv-sel input[type=range] { width: 100%; }
.pv-h { margin: 6px 0 0; font: 700 20px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.pv-warn { margin: 0; padding: 8px 10px; background: #fff4e0; border: 1px solid #e5b66b; border-radius: 8px; color: #6b5420; font-size: 13px; }
.pvm { display: grid; grid-template-columns: 84px minmax(0, 1fr) 34px; gap: 6px; align-items: center; margin-bottom: 8px; }
.pvm .n, .pvm .xn { grid-column: 1 / -1; }
.pvm .n { overflow-wrap: anywhere; font-size: 14px; }
.pvm .n i { font-style: normal; color: var(--muted); }
.pvm input { min-height: 40px; padding: 6px 8px; font-size: 15px; min-width: 0; }

/* fab + toast */
.fab {
  position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  min-height: 52px; padding: 0 20px; border-radius: 26px; border: 0; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.fab svg { width: 20px; height: 20px; }
#toast {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px);
  background: #14191e; color: #fff; border: 1px solid #14191e; border-radius: 10px; padding: 10px 14px; font-size: 14px; text-align: center;
}
#toast.err { border-color: var(--danger); }
.card.todo { background: #fff0ee; border-color: #e8a199; }
.card.done { background: #e8f6ec; border-color: #86c99a; }
.card.void { background: var(--surface); }
.card.todo .head, .card.done .head { color: var(--fg); }
.badge.todo { background: var(--danger); color: #fff; }
.badge.done { background: var(--cash); color: #fff; }
.savebar { display: grid; gap: 8px; }
.alarmbar { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.alrow { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.alrow > div { min-width: 0; }
.alrow label { font-size: 14px; }
.alrow select { flex: 1; min-width: 0; }
.tog { min-height: 40px; min-width: 84px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; color: var(--muted); }
.tog.on { background: var(--cash); border-color: var(--cash); color: #fff; }
select { width: 100%; min-height: 44px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
.albtn { background: none; border: 0; padding: 0; font: inherit; text-align: left; width: 100%; cursor: pointer; }
.albtn .sw { margin-left: auto; flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); background: var(--bg); }
.line.albtn.off, .line.albtn.off .ico { color: var(--muted); }
#ring { position: fixed; z-index: 40; left: 0; right: 0; top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; }
#ring[hidden] { display: none; }
.rg { background: #14191e; color: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--accent); }
.rg .rt { font: 700 22px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: #ffb84d; }
.rg .rn { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.rg .rs { color: #b9c3cc; font-size: 14px; overflow-wrap: anywhere; }
.rg .rb { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; margin-top: 8px; }
.rg .btn { min-height: 44px; padding: 0 8px; font-size: 14px; background: #2a333c; border-color: #3b4753; color: #fff; }
.rg .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
details > summary { list-style: none; cursor: pointer; min-height: 40px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ""; margin-left: auto; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
details[open] > summary::after { transform: rotate(225deg); }
details > summary .ico { color: var(--accent); }
.alarmbar { display: block; padding: 4px 14px; }
.alin { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px; }
.aldet { padding-right: 4px; }
.aldet > summary { min-height: 36px; font-weight: 500; color: var(--muted); font-size: 14px; }
.sync { background: none; border: 0; font: inherit; font-size: 12px; padding: 2px 0 2px 6px; cursor: pointer; }
.sync.ok { color: var(--cash); }
.sync.saving { color: var(--muted); }
.sync.warn { color: var(--accent); }
.sync.err { color: var(--danger); font-weight: 600; }
.diag { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
.diag pre { margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); max-height: 240px; overflow: auto; }
.ver { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 6px; }
.when { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Menu a tendina in alto a sinistra */
.brand { justify-content: flex-start; }
.brand .when { margin-left: auto; }
.burger { background: none; border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 36px; font-size: 20px; line-height: 1; color: var(--fg); cursor: pointer; flex: none; align-self: center; }
.menu { display: flex; flex-direction: column; gap: 8px; padding: 10px; margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.menu .alarmbar { margin: 0; }

.sub b { font-weight: 800; color: var(--fg); }

.app-line { display: block; font-style: normal; }
.app-line b { font-weight: 800; color: var(--fg); }

/* Allarme in corso: lampeggia lo sfondo rosso della scheda finché non si preme Ok */
@keyframes lampeggia { 0%, 49% { background: #e53935; } 50%, 100% { background: #fff0ee; } }
.card.urgent { animation: lampeggia 1s steps(1, end) infinite; border-color: #d11a1a; }
@media (prefers-reduced-motion: reduce) { .card.urgent { animation: none; background: #ffc9c6; } }

label.btn { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.line-tel a.tl { color: inherit; text-decoration: underline; padding: 8px 2px; display: inline-block; }
