<style>html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#fff;font:14px system-ui,sans-serif}</style>
<style>

/* Layout: schermata unica scura per il lavoro in furgone. Barra alta fissa con schede Oggi / Archivio, riepilogo incassi in cima, elenco schede a colonna singola. */
:root {
  --bg: #ffffff;
  --surface: #f4f6f8;
  --raised: #e8ecf0;
  --line: #d3d9df;
  --fg: #14191e;
  --muted: #5d6874;
  --accent: #d9820f;
  --accent-ink: #ffffff;
  --cash: #1f8a3b;
  --pos: #1d6fc4;
  --danger: #d42a1c;
  --info: #1555c0;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
  background: var(--bg);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--f-body);
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }

/* splash */
#splash {
  position: fixed; inset: 0; z-index: 50; background: #fff; color: #14191e;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  text-align: center; cursor: pointer; border: 0; width: 100%;
  transition: opacity .45s ease;
}
#splash.out { opacity: 0; pointer-events: none; }
#splash .s1 { font: 700 clamp(44px, 16vw, 84px)/0.95 var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
#splash .s2 { font: 600 clamp(20px, 7vw, 34px)/1 var(--f-display); letter-spacing: .5em; text-transform: uppercase; color: var(--accent); margin-right: -.5em; }
#splash .bar { width: 64px; height: 3px; background: var(--accent); margin: 6px 0; }
#splash .s3 { font-size: 13px; color: #6b7480; letter-spacing: .08em; text-transform: uppercase; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; padding-bottom: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font: 700 26px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand .when { color: var(--muted); font-size: 13px; text-align: right; min-width: 0; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tabs button {
  min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font: 600 15px var(--f-body); color: var(--muted);
}
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.back { align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

main { padding-top: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* totals */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sum .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sum .v { font: 600 24px/1.1 var(--f-display); margin-top: 2px; overflow-wrap: anywhere; }
.sum .v.cash { color: var(--cash); }
.sum .v.pos { color: var(--pos); }
.sum .meta { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--raised); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.danger.on { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg, .ico { width: 18px; height: 18px; flex: none; }
.dateline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.dateline input { min-height: 38px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; color-scheme: light; }

/* progress */
.busy { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.busy .t { font-weight: 600; }
.track { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

/* alerts */
.alerts { background: #fff4e0; border: 1px solid #e5b66b; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.alerts h2 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.alerts p { margin: 0; color: #6b5420; font-size: 13px; }
.al { background: #fff; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.al b { font-weight: 600; }
.diff { font-size: 14px; overflow-wrap: anywhere; }
.diff s { color: var(--muted); }
.diff em { font-style: normal; color: var(--accent); }
.al .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.al .btn { min-height: 40px; font-size: 14px; }

/* cards */
.list { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card .body { display: flex; flex-direction: column; }
.card.void .body { opacity: .45; }
.head { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 12px 8px; }
.ord { font: 700 30px/1 var(--f-display); color: var(--accent); text-align: center; }
.nm { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; }

<script>
/* 'locale': ogni telefono tiene i propri dati, nessun server, nessun accesso.
   'server': dati sul server dei colleghi (vedi server.js). */
window.CIVITECH_MODE = 'locale';

</script>
<script>
/* Sostituisce i servizi della piattaforma Claude (utente, database, dettatura, download)
   con servizi propri. app.js non cambia: chiama window.claude.use(nome) come prima. */
(function () {
  'use strict';
  if (window.claude) return;
  var TK = 'civitech-token', UK = 'civitech-uid';
  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ---- accesso ---- */
  var loginP = null;
  function loginUI(msg) {
    if (loginP) return loginP;
    loginP = new Promise(function (resolve) {
      var o = document.createElement('div');
      o.id = 'login';
      o.style.cssText = 'position:fixed;inset:0;z-index:99;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif';
      o.innerHTML = '<form style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px">' +
        '<div style="font:700 30px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.06em;text-transform:uppercase">Civitech <span style="color:#d9820f">Planning</span></div>' +
        '<div id="lmsg" style="color:#b3261e;font-size:14px;min-height:18px"></div>' +
        '<input name="n" placeholder="Nome utente" autocomplete="username" autocapitalize="none" style="font-size:17px;padding:12px;border:1px solid #d3d9df;border-radius:8px">' +
        '<input name="p" type="password" placeholder="PIN o password" autocomplete="current-password" style="font-size:17px;padding:12px;border:1px solid #d3d9df;border-radius:8px">' +
        '<button style="font-size:17px;font-weight:600;padding:12px;border:0;border-radius:8px;background:#d9820f;color:#fff">Entra</button></form>';
      document.body.appendChild(o);
      o.querySelector('#lmsg').textContent = msg || '';
      o.querySelector('form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var f = ev.target, n = f.n.value.trim(), p = f.p.value;
        fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: n, pin: p }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok) { o.querySelector('#lmsg').textContent = x.j.error || 'Accesso non riuscito'; return; }
            ls.set(TK, x.j.token); ls.set(UK, x.j.user);
            o.remove(); loginP = null; resolve(x.j.user);
          })
          .catch(function () { o.querySelector('#lmsg').textContent = 'Server non raggiungibile. Riprova.'; });
      });
    });
    return loginP;
  }
  function ensureUser() {
    if (ls.get(TK) && ls.get(UK)) return Promise.resolve(ls.get(UK));
    return new Promise(function (res) {
      if (document.body) loginUI().then(res); else document.addEventListener('DOMContentLoaded', function () { loginUI().then(res); });
    });
  }
  var user = { id: function () { return ensureUser(); } };

  /* ---- database: stessa forma usata dall'app (doc / collection / get / set) ---- */
  function api(method, path, body) {
    return fetch('/api/' + path, {
      method: method,
      headers: { Authorization: 'Bearer ' + ls.get(TK), 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 401) { ls.del(TK); throw { code: 'unauthorized', message: 'accesso scaduto' }; }
      if (r.status === 404) return null;
      if (!r.ok) throw { code: 'http_' + r.status, message: 'errore ' + r.status };
      return r.json();
    });
  }
  function docRef(col, id) {
    return {
      get: function () { return api('GET', 'c/' + col + '/' + id).then(function (d) { return { exists: !!d, id: id, data: function () { return d; } }; }); },
      set: function (obj) { return api('PUT', 'c/' + col + '/' + id, obj); }
    };
  }
  function colRef(col) {
    return {
      get: function () { return api('GET', 'c/' + col).then(function (l) { return { docs: (l || []).map(function (x) { return { id: x.id, data: function () { return x.data; } }; }) }; }); },
      doc: function (id) { return docRef(col, id); }
    };
  }
  var db = { doc: function () { return { collection: colRef }; } };

  /* ---- dettatura (Web Speech del browser) ---- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, dict = null;
  if (SR) {
    var rec = null, onS = function () {}, onF = function () {}, onP = function () {};
    dict = {
      start: function () {
        return new Promise(function (res, rej) {
          rec = new SR(); rec.lang = 'it-IT'; rec.continuous = true; rec.interimResults = true;
          rec.onstart = function () { onS({ state: 'listening' }); res(); };
          rec.onend = function () { onS({ state: 'idle', reason: 'stopped' }); };
          rec.onerror = function (e) { if (e.error === 'not-allowed') { rej({ code: 'not_granted' }); } onS({ state: 'idle', reason: e.error }); };
          rec.onresult = function (e) {
            for (var i = e.resultIndex; i < e.results.length; i++) {
              var t = e.results[i][0].transcript;
              if (e.results[i].isFinal) onF({ text: t }); else onP({ text: t });
            }
          };
          try { rec.start(); } catch (x) { rej(x); }
        });
      },
      stop: function () { try { rec && rec.stop(); } catch (e) {} return Promise.resolve(); },
      onState: function (f) { onS = f; }, onFinal: function (f) { onF = f; }, onPartial: function (f) { onP = f; }
    };
  }

  /* ---- scaricamento file (PDF del planning) ---- */
  var downloads = {
    save: function (o) {
      var blob = new Blob([o.data], { type: /\.pdf$/i.test(o.filename) ? 'application/pdf' : 'application/octet-stream' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = o.filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      return Promise.resolve();
    }
  };

  var SERVER = window.CIVITECH_MODE === 'server';   /* vedi config.js: 'locale' = ognuno per conto suo, nessun server */
  var caps = { user: SERVER ? user : null, db: SERVER ? db : null, dictation: dict, downloads: downloads, sample: null };
  window.claude = { use: function (n) { return Promise.resolve(caps[n] || null); } };
})();

</script>

          doc.setFont('times', 'bold');
          for (; nfs >= 7; nfs -= 0.5) { doc.setFontSize(nfs); nl = doc.splitTextToSize(nlab, 258); nlh = nfs * 1.1; if (nl.length * nlh <= nroom) break; }
          if (nfs < 7) { nfs = 7; doc.setFontSize(7); nl = doc.splitTextToSize(nlab, 258); nlh = 7.7; }
          var nfit = Math.max(1, Math.floor(nroom / nlh));
          if (nl.length > nfit) { over.push({ n: i + 1, nome: s.nome, orario: s.orario, text: nlab }); nl = nl.slice(0, Math.max(0, nfit - 1)).concat(['... (testo completo in fondo)']); }
          nl.forEach(function (ln) { doc.text(ln, rx, ty + 4); ty += nlh; });
        }
        if (!s.annullata && s.pag) txt('PAGATO ' + (s.pag === 'pos' ? 'CON POS' : 'IN CONTANTI') + ': ' + money(s.pagImporto), rx, y + BH - 9, 11, true);
        if (!s.annullata && s.bollino) {
          var btx = 'BOLLINO: ' + money(s.bollino), bfs = 11;
          doc.setFont('times', 'bold'); doc.setFontSize(11);
          var pw = s.pag ? doc.getTextWidth('PAGATO ' + (s.pag === 'pos' ? 'CON POS' : 'IN CONTANTI') + ': ' + money(s.pagImporto)) : 0;
          while (bfs > 7 && (rx + pw + 10 + doc.getTextWidth(btx) > X + BW - 4)) { bfs -= 0.5; doc.setFontSize(bfs); }
          txt(btx, X + BW - 6, y + BH - 9, bfs, true, { align: 'right' });
        }
        if (s.annullata) {
          doc.setTextColor(212, 42, 28); txt('ANNULLATA DA UFFICIO', X + BW / 2 - 70, y + BH / 2 + 30, 26, true, { angle: 10 }); doc.setTextColor(0);
        }
      });
      var t = totals(p), last = (p.schede.length - 1) % PER, ty2 = Y0 + (last + 1) * PITCH + 4;
      if (ty2 > 775) { doc.addPage(); ty2 = Y0 + 10; }
      txt('Totale contanti: ' + money(t.cash), X, ty2 + 8, 11, true);
      txt('Totale POS/Bancomat: ' + money(t.pos), X, ty2 + 22, 11, true);
      txt('Totale incassato + bollini: ' + money(t.cash + t.pos + t.bol), X, ty2 + 36, 11, true);
      txt('Totale bollini: ' + money(t.bol), X, ty2 + 50, 11, true);
      if (over.length) {
        doc.addPage(); var oy = 50; doc.setTextColor(0);
        txt('NOTE COMPLETE', 30, oy, 14, true); oy += 26;
        over.forEach(function (o) {
          var head = o.n + ') ' + (o.nome || '') + (o.orario ? ' - ' + o.orario : '');
          var lines = doc.splitTextToSize(o.text, 535);
          if (oy + 16 + lines.length * 13 > 800) { doc.addPage(); oy = 50; }
          txt(head, 30, oy, 11.5, true); oy += 15;
          doc.setFont('times', 'normal'); doc.setFontSize(11);
          lines.forEach(function (ln) { if (oy > 800) { doc.addPage(); oy = 50; doc.setFont('times', 'normal'); doc.setFontSize(11); } doc.text(ln, 30, oy); oy += 13; });
          oy += 12;
        });
      }
      await dl.save({ filename: 'Planning-' + dateIt + '.pdf', data: doc.output('arraybuffer') });
      note('PDF pronto. Dal menu che si apre scegli Stampa e la stampante, oppure apri il file e stampalo da lì.');
    } catch (e) {
      if (!(e && e.code === 'declined')) note('Non sono riuscito a creare il PDF.', true);
    }
  }

  /* ---------- avvio ---------- */
  var splash = $('#splash'), sTimer;
  var hideSplash = function () { clearTimeout(sTimer); splash.classList.add('out'); setTimeout(function () { splash.hidden = true; }, 500); };
  splash.addEventListener('click', hideSplash);
  sTimer = setTimeout(hideSplash, 2200);
  render();
  (async function () {
    await initStore();
    S.ready = true; render();
    checkAlarms(); setInterval(checkAlarms, 15000);
    setInterval(function () { if (S.mode === 'db' && Object.keys(pend).length && !Object.keys(inflight).length) flushAll(); }, 20000);
    sampleFn = await cap('sample');
    if (sampleFn) { try { var lim = await sampleFn.limits(); imgMax = (lim && lim.images && lim.images.maxCount) || 0; } catch (e) { imgMax = 0; } }
    dict = await cap('dictation');
    if (dict) {
      try {
        dict.onState(function (st) { dictOn = st.state === 'listening'; if (!dictOn && st.state === 'idle') { } var b = document.querySelector('.mic'); document.querySelectorAll('.mic').forEach(function (m) { m.classList.toggle('on', dictOn && m.dataset.sid === dictTarget); }); });
        dict.onFinal(function (r) {
          var p = current(), s = dictTarget && findS(dictTarget); if (!s || !p || !r.text) return;
          s.note = (s.note ? s.note + ' ' : '') + r.text; touch(p);
          var el = document.getElementById('f-' + s.id + '-note'); if (el) el.value = s.note; autosize(el);
        });
      } catch (e) { dict = null; }
    }
    render();
  })();
})();

</script>
