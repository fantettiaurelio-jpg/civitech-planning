<title>Civitech Planning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: schermata unica scura per il lavoro in furgone. Barra alta fissa con schede Oggi / Archivio, riepilogo incassi in cima, elenco schede a colonna singola. */
:root {
  --bg: #ffffff;
  --surface: #f4f6f8;
  --raised: #e8ecf0;
  --line: #d3d9df;
  --fg: #14191e;
  --muted: #5d6874;
  --accent: #d9820f;
  --accent-ink: #ffffff;
  --cash: #1f8a3b;
  --pos: #1d6fc4;
  --danger: #d42a1c;
  --info: #1555c0;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
  background: var(--bg);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--f-body);
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }

/* splash */
#splash {
  position: fixed; inset: 0; z-index: 50; background: #fff; color: #14191e;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  text-align: center; cursor: pointer; border: 0; width: 100%;
  transition: opacity .45s ease;
}
#splash.out { opacity: 0; pointer-events: none; }
#splash .s1 { font: 700 clamp(44px, 16vw, 84px)/0.95 var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
#splash .s2 { font: 600 clamp(20px, 7vw, 34px)/1 var(--f-display); letter-spacing: .5em; text-transform: uppercase; color: var(--accent); margin-right: -.5em; }
#splash .bar { width: 64px; height: 3px; background: var(--accent); margin: 6px 0; }
#splash .s3 { font-size: 13px; color: #6b7480; letter-spacing: .08em; text-transform: uppercase; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; padding-bottom: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font: 700 26px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand .when { color: var(--muted); font-size: 13px; text-align: right; min-width: 0; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tabs button {
  min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font: 600 15px var(--f-body); color: var(--muted);
}
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.back { align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

main { padding-top: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* totals */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.sum-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sum .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sum .v { font: 600 24px/1.1 var(--f-display); margin-top: 2px; overflow-wrap: anywhere; }
.sum .v.cash { color: var(--cash); }
.sum .v.pos { color: var(--pos); }
.sum .meta { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--raised); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.danger.on { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg, .ico { width: 18px; height: 18px; flex: none; }
.dateline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.dateline input { min-height: 38px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; color-scheme: light; }

/* progress */
.busy { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.busy .t { font-weight: 600; }
.track { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

/* alerts */
.alerts { background: #fff4e0; border: 1px solid #e5b66b; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.alerts h2 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.alerts p { margin: 0; color: #6b5420; font-size: 13px; }
.al { background: #fff; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.al b { font-weight: 600; }
.diff { font-size: 14px; overflow-wrap: anywhere; }
.diff s { color: var(--muted); }
.diff em { font-style: normal; color: var(--accent); }
.al .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.al .btn { min-height: 40px; font-size: 14px; }

/* cards */
.list { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card .body { display: flex; flex-direction: column; }
.card.void .body { opacity: .45; }
.head { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 12px 8px; }
.ord { font: 700 30px/1 var(--f-display); color: var(--accent); text-align: center; }
.nm { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; }
.card.open .chev { transform: rotate(180deg); }
.badge { font: 600 11px var(--f-body); letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.badge.man { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.lines { padding: 0 12px 8px 62px; display: flex; flex-direction: column; gap: 6px; }
.line { display: flex; align-items: flex-start; gap: 8px; min-height: 34px; text-decoration: none; color: var(--fg); overflow-wrap: anywhere; }
.line .ico { margin-top: 2px; color: var(--accent); }
.line.miss { color: var(--muted); }
.line .txt { min-width: 0; }
.line-tel { display: flex; align-items: center; gap: 8px; }
.line-tel .line { flex: 1; min-width: 0; }
.mini { min-height: 34px; min-width: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); display: inline-flex; align-items: center; justify-content: center; }
.mini svg { width: 16px; height: 16px; }
.savebar { padding: 0 12px 12px; }
.savebar .btn { width: 100%; }
.quick { padding: 2px 12px 10px 62px; display: flex; flex-direction: column; gap: 4px; }
.quick label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.quick textarea { min-height: 56px; }
.nm span[id^="h-nome"] { color: var(--info); }
.line:not(.miss), .line:not(.miss) .ico { color: var(--info); }
.line-tel .line .txt { font-weight: 500; }
.note-prev { padding: 0 12px 8px 62px; color: var(--muted); font-size: 13px; font-style: italic; overflow-wrap: anywhere; }
.pay { padding: 8px 12px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: #cfd6dd; color: var(--fg); border-color: #9aa5b0; }
.seg button.on.cash { background: var(--cash); color: #fff; border-color: var(--cash); }
.seg button.on.pos { background: var(--pos); color: #fff; border-color: var(--pos); }
.amt { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.amt input { flex: 1; min-width: 0; }
.ro-pay { color: var(--muted); font-size: 14px; }
.ro-pay b { color: var(--fg); }
.stamp {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg);
  font: 700 clamp(22px, 7.4vw, 34px)/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  color: var(--danger); border: 3px solid var(--danger); border-radius: 6px; padding: 6px 12px;
  white-space: nowrap; pointer-events: none; background: rgba(255,255,255,.8);
}

/* forms */
.form { padding: 4px 12px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; grid-column: span 6; }
.fld.h { grid-column: span 3; }
.fld.w4 { grid-column: span 4; }
.fld.w2 { grid-column: span 2; }
.fld label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=tel], input[type=date], textarea, .amt input {
  width: 100%; min-height: 44px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px;
}
textarea { min-height: 76px; resize: vertical; }
.noterow { display: flex; gap: 8px; align-items: flex-start; }
.noterow textarea { flex: 1; min-width: 0; }
.mic.on { background: var(--danger); color: #fff; border-color: var(--danger); }
.form .btns { grid-column: span 6; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
.dl { margin: 0; padding: 4px 12px 14px 62px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 14px; }
.dl div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; overflow-wrap: anywhere; }

/* empty + archive */
.empty { border: 1px dashed #b4bdc6; border-radius: 12px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h2 { margin: 0; font: 700 26px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.search { display: flex; flex-direction: column; gap: 6px; }
.search label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.arch-list { display: flex; flex-direction: column; gap: 8px; }
.arch { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.arch .d { font-weight: 600; text-transform: capitalize; }
.arch .m { color: var(--muted); font-size: 13px; }
.arch .m .c { color: var(--cash); }
.arch .m .p { color: var(--pos); }
.hit .d { text-transform: none; }
.ro-banner { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ro-banner b { text-transform: capitalize; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }

/* fab + toast */
.fab {
  position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  min-height: 52px; padding: 0 20px; border-radius: 26px; border: 0; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.fab svg { width: 20px; height: 20px; }
#toast {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px);
  background: #14191e; color: #fff; border: 1px solid #14191e; border-radius: 10px; padding: 10px 14px; font-size: 14px; text-align: center;
}
#toast.err { border-color: var(--danger); }
.card.todo { background: #fff0ee; border-color: #e8a199; }
.card.done { background: #e8f6ec; border-color: #86c99a; }
.card.void { background: var(--surface); }
.card.todo .head, .card.done .head { color: var(--fg); }
.badge.todo { background: var(--danger); color: #fff; }
.badge.done { background: var(--cash); color: #fff; }
.savebar { display: grid; gap: 8px; }
.alarmbar { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.alrow { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.alrow > div { min-width: 0; }
.alrow label { font-size: 14px; }
.alrow select { flex: 1; min-width: 0; }
.tog { min-height: 40px; min-width: 84px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; color: var(--muted); }
.tog.on { background: var(--cash); border-color: var(--cash); color: #fff; }
select { width: 100%; min-height: 44px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
.albtn { background: none; border: 0; padding: 0; font: inherit; text-align: left; width: 100%; cursor: pointer; }
.albtn .sw { margin-left: auto; flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); background: var(--bg); }
.line.albtn.off, .line.albtn.off .ico { color: var(--muted); }
#ring { position: fixed; z-index: 40; left: 0; right: 0; top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; }
#ring[hidden] { display: none; }
.rg { background: #14191e; color: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--accent); }
.rg .rt { font: 700 22px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: #ffb84d; }
.rg .rn { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.rg .rs { color: #b9c3cc; font-size: 14px; overflow-wrap: anywhere; }
.rg .rb { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; margin-top: 8px; }
.rg .btn { min-height: 44px; padding: 0 8px; font-size: 14px; background: #2a333c; border-color: #3b4753; color: #fff; }
.rg .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
details > summary { list-style: none; cursor: pointer; min-height: 40px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ""; margin-left: auto; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
details[open] > summary::after { transform: rotate(225deg); }
details > summary .ico { color: var(--accent); }
.alarmbar { display: block; padding: 4px 14px; }
.alin { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px; }
.aldet { padding-right: 4px; }
.aldet > summary { min-height: 36px; font-weight: 500; color: var(--muted); font-size: 14px; }
.sync { background: none; border: 0; font: inherit; font-size: 12px; padding: 2px 0 2px 6px; cursor: pointer; }
.sync.ok { color: var(--cash); }
.sync.saving { color: var(--muted); }
.sync.warn { color: var(--accent); }
.sync.err { color: var(--danger); font-weight: 600; }
.diag { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
.diag pre { margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); max-height: 240px; overflow: auto; }
.ver { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 6px; }
.when { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<button id="splash" type="button" aria-label="Entra in Civitech Planning">
  <div class="s1">Civitech</div>
  <div class="bar"></div>
  <div class="s2">Planning</div>
  <div class="s3">Tocca per entrare</div>
</button>

<header class="top"><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="main" aria-live="polite"></main>
<div id="ring" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept="application/pdf,image/*" hidden>

  var ICON = {

    }
    var arr = archived();
    if (!arr.length) return '<div class="empty"><h2>Archivio vuoto</h2><p>Quando carichi un nuovo planning, quello precedente viene archiviato qui e puoi riprenderlo quando serve.</p></div>';
    return '<div class="arch-list">' + arr.map(function (p) {
      return '<button type="button" class="arch" data-act="open" data-pid="' + p.id + '"><span class="d">' + esc(fmtLong(p.date)) + '</span><span class="m">' + rowTxt(p) + '</span></button>';
    }).join('') + '</div>';
  }
  function archivioHTML() {
    return '<div class="search"><label for="q">Cerca cliente, via o lavorazione</label><input type="text" id="q" autocomplete="off" value="' + esc(S.query) + '" placeholder="Es. Rossi, Via Roma, sostituzione caldaia"></div><div id="results">' + resultsHTML() + '</div>';
  }
  function detailHTML() {
    var p = S.plannings[S.detailId];
    if (!p) return '<p class="foot">Planning non trovato.</p>';
    return '<section class="ro-banner"><div><b>' + esc(fmtLong(p.date)) + '</b><br><span class="foot" style="text-align:left">' + (p.status === 'current' ? 'Planning attuale' : 'Archiviato · sola lettura') + '</span></div>' +
      '<div class="foot" style="text-align:left">' + rowTxt(p) + '</div><div class="actions">' +
      (p.status === 'archived' ? '<button type="button" class="btn primary" data-act="restore" data-pid="' + p.id + '">Riprendi</button>' : '<button type="button" class="btn" data-act="tab" data-v="oggi">Vai a Oggi</button>') +
      '<button type="button" class="btn" data-act="pdf" data-pid="' + p.id + '">' + ICON.down + 'Stampa</button></div></section>' +
      '<ul class="list">' + p.schede.map(function (s, i) { return cardHTML(s, i, true); }).join('') + '</ul>';
  }
  function hdrHTML() {
    var p = current(), n = archived().length;
    var h = '<div class="brand"><h1>Civitech <span>Planning</span></h1><div class="when"><span class="ver">v14</span> <span class="dt">' + (S.view === 'oggi' && p ? esc(fmtShort(p.date)) : '') + '</span><button type="button" id="sync" class="sync ' + syncCls() + '" data-act="syncnow">' + esc(syncTxt()) + '</button></div></div>';
    if (S.view === 'detail') h += '<button type="button" class="back" data-act="tab" data-v="archivio">← Archivio</button>';
    else h += '<div class="tabs" role="tablist"><button type="button" role="tab" data-act="tab" data-v="oggi" class="' + (S.view === 'oggi' ? 'on' : '') + '" aria-selected="' + (S.view === 'oggi') + '">Oggi</button><button type="button" role="tab" data-act="tab" data-v="archivio" class="' + (S.view === 'archivio' ? 'on' : '') + '" aria-selected="' + (S.view === 'archivio') + '">Archivio' + (n ? ' (' + n + ')' : '') + '</button></div>';
    return h;
  }
  function render() {
    $('#hdr').innerHTML = hdrHTML();
    if (!S.ready) { $('#main').innerHTML = '<p class="foot">Carico i dati…</p>'; return; }
    var h = S.view === 'oggi' ? oggiHTML() : S.view === 'archivio' ? archivioHTML() : detailHTML();
    if (S.view === 'oggi' && current()) h += '<button type="button" class="fab" data-act="add">' + ICON.plus + 'Scheda</button>';
    $('#main').innerHTML = h;
  }

  /* ---------- azioni ---------- */
  function patchCard(sid) {
    var s = findS(sid); if (!s) return;
    var set = function (id, t) { var e = document.getElementById(id); if (e) e.textContent = t; };
    set('h-nome-' + sid, s.nome || 'Senza nome'); set('h-sub-' + sid, subLine(s));
    var m = document.getElementById('l-maps-' + sid), a = addr(s);
    if (m && m.tagName === 'A' && a) { m.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a); m.querySelector('.txt').textContent = a; }
    var al = document.getElementById('l-al-' + sid); if (al) al.outerHTML = alarmLine(s);
    var as = document.querySelector('details[data-alk="' + sid + '"] .alsum'); if (as) { var pp = current(), ad2 = pp && alarmDate(pp, s); as.textContent = !ad2 ? 'Allarme non disponibile' : (S.settings.alarmOn && s.allarme !== 'off' && !s.fatta && !s.annullata) ? 'Allarme alle ' + hhmm(ad2) : 'Allarme spento'; }
    var t = document.getElementById('l-tel-' + sid);
    if (t && t.tagName === 'A' && s.telefono) { t.href = 'tel:' + s.telefono.replace(/[^\d+]/g, ''); t.querySelector('.txt').textContent = s.telefono; }
  }
  function touch(p) { p.updatedAt = Date.now(); saveP(p.id); }
  function focusLater(id) { setTimeout(function () { var e = document.getElementById(id); if (e) { e.focus(); e.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, 40); }
  function openPlanning(pid) { var p = S.plannings[pid]; if (!p) return; if (p.status === 'current') S.view = 'oggi'; else { S.view = 'detail'; S.detailId = pid; } S.open = null; render(); window.scrollTo(0, 0); }

  document.addEventListener('click', async function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    dlog('tocco: ' + b.dataset.act);
    var a = b.dataset.act, sid = b.dataset.sid, p = current(), s = sid ? (S.view === 'detail' ? (S.plannings[S.detailId].schede.filter(function (x) { return x.id === sid; })[0]) : findS(sid)) : null;
    if (a === 'tab') { S.view = b.dataset.v; S.open = null; S.confirmDel = null; render(); window.scrollTo(0, 0); }
    else if (a === 'toggle') { S.open = S.open === sid ? null : sid; S.confirmDel = null; render(); }
    else if (a === 'upload') { $('#file').click(); }
    else if (a === 'save' && p) {
      if (s && !s.annullata) s.fatta = true;
      touch(p); S.open = null; S.confirmDel = null; render();
      try { await saveNow(p.id); note(S.mode === 'db' ? 'Scheda salvata.' : 'Scheda salvata su questo telefono.'); }
      catch (x) { note('Salvata sul telefono, ma online non riuscito (' + ((x && (x.message || x.code)) || 'errore') + '). Riprovo da solo.', true); }
    }
    else if (a === 'undo' && s && p) { s.fatta = false; touch(p); render(); }
    else if (a === 'altog' && s && p) { s.allarme = s.allarme === 'off' ? 'on' : 'off'; touch(p); render(); }
    else if (a === 'alon') { S.settings.alarmOn = !S.settings.alarmOn; saveSet(); render(); }
    else if (a === 'altest') { unlockAudio(); beep(); note('Allarme di prova. Se non senti il suono, controlla il volume e la modalità silenziosa.'); }
    else if (a === 'rgok') { S.ringing = S.ringing.filter(function (x) { return x !== sid; }); renderRing(); }
    else if (a === 'rgsnooze') { S.ringing = S.ringing.filter(function (x) { return x !== sid; }); S.snooze[sid] = Date.now() + 5 * 60000; renderRing(); note('Ti avviso di nuovo tra 5 minuti.'); }
    else if (a === 'rgopen') { S.ringing = S.ringing.filter(function (x) { return x !== sid; }); renderRing(); S.view = 'oggi'; S.open = sid; render(); setTimeout(function () { var c = document.querySelector('[data-sid="' + sid + '"].card, li[data-sid="' + sid + '"]'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 40); }
    else if (a === 'syncnow') { var cp = current(); if (cp) pend[cp.id] = 1; flushAll(); note('Provo a salvare online…'); }
    else if (a === 'probe') {
      if (S.mode !== 'db') { note('Non sei collegato al tuo account: i dati restano solo su questo telefono.', true); return; }
      try { await withTimeout(base.collection('meta').doc('probe').set({ t: Date.now() }), 12000); dlog('prova scrittura: OK'); note('Prova di scrittura riuscita.'); }
      catch (x) { dlog('prova scrittura FALLITA: ' + ((x && (x.code || x.message)) || 'errore')); note('Prova di scrittura fallita (' + ((x && (x.code || x.message)) || 'errore') + ').', true); }
    }
    else if (a === 'cancel') { if (ctl) ctl.abort(); }
    else if (a === 'copy') { try { await navigator.clipboard.writeText(b.dataset.v); note('Numero copiato.'); } catch (x) { note('Copia non disponibile: tieni premuto sul numero.', true); } }
    else if (a === 'pay' && s && p) {
      s.pag = b.dataset.v;
      if (!s.pag) s.pagImporto = null; else if (s.pagImporto == null) s.pagImporto = s.importo;
      touch(p); render();
    }
    else if (a === 'void' && s && p) {
      s.annullata = !s.annullata; touch(p); render();
      if (s.annullata) focusLater('f-' + s.id + '-note');
    }
    else if (a === 'del' && s && p) {
      if (S.confirmDel !== sid) { S.confirmDel = sid; render(); return; }
      p.schede = p.schede.filter(function (x) { return x.id !== sid; });
      p.avvisi = (p.avvisi || []).filter(function (x) { return x.sid !== sid; });
      S.open = null; S.confirmDel = null; touch(p); render(); note('Scheda eliminata.');
    }
    else if (a === 'add') {
      if (!p) { p = { id: rid(), date: todayStr(), status: 'current', createdAt: Date.now(), fonte: '', schede: [], avvisi: [] }; S.plannings[p.id] = p; }
      var n = blank(); n.manuale = true; if (p.schede[0]) { n.azienda = p.schede[0].azienda; n.tecnico = p.schede[0].tecnico; } p.schede.push(n); S.open = n.id; S.view = 'oggi'; touch(p); render(); focusLater('f-' + n.id + '-nome');
    }
    else if (a === 'keepnew' && p) { p.avvisi = p.avvisi.filter(function (x) { return x.sid !== sid; }); var k = findS(sid); if (k) k.avviso = false; touch(p); render(); }
    else if (a === 'revert' && p) {
      var av = p.avvisi.filter(function (x) { return x.sid === sid; })[0], k2 = findS(sid);
      if (av && k2) { av.diffs.forEach(function (d) { k2[d.f] = d.old; }); k2.avviso = false; rubricaPut(k2); }
      p.avvisi = p.avvisi.filter(function (x) { return x.sid !== sid; }); touch(p); render(); note('Dati precedenti rimessi.');
    }
    else if (a === 'open') { openPlanning(b.dataset.pid); window.scrollTo(0, 0); }
    else if (a === 'restore') {
      var t = S.plannings[b.dataset.pid]; if (!t) return;
      var cur = current(); if (cur) { cur.status = 'archived'; cur.archivedAt = Date.now(); saveP(cur.id); }
      t.status = 'current'; delete t.archivedAt; touch(t); S.view = 'oggi'; S.open = null; render(); window.scrollTo(0, 0);
      note(cur ? 'Planning ripreso. Quello di prima è in archivio.' : 'Planning ripreso.');
    }
    else if (a === 'pdf') { exportPdf(S.plannings[b.dataset.pid]); }
    else if (a === 'mic' && dict && s) {
      if (dictOn && dictTarget === sid) { try { await dict.stop(); } catch (x) {} return; }
      dictTarget = sid;
      try { await dict.start(); } catch (x) { dictTarget = null; if (x && x.code === 'not_granted') note('Dettatura non consentita.', true); }
    }
  });
  document.addEventListener('toggle', function (e) { var d = e.target; if (!d || !d.dataset) return; if (d.dataset.alk) S.alOpen[d.dataset.alk] = d.open; else if (d.dataset.alg) S.alOpen.g = d.open; }, true);
  document.addEventListener('change', function (e) {
    var t = e.target, p = current();
    if (t.id === 'lead') { S.settings.lead = +t.value || 30; saveSet(); render(); }
    else if (t.dataset && t.dataset.lead && p) { var s = findS(t.dataset.lead); if (s) { s.lead = t.value === '' ? null : +t.value; touch(p); render(); } }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { S.query = t.value; $('#results').innerHTML = resultsHTML(); return; }
    if (t.id === 'pdate') { var p0 = current(); if (p0 && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { p0.date = t.value; touch(p0); var w = $('.when .dt'); if (w) w.textContent = fmtShort(p0.date); } return; }
    var f = t.dataset && t.dataset.f; if (!f) return;
    var p = current(), s = findS(t.dataset.sid); if (!s || !p) return;
    s[f] = (f === 'importo' || f === 'pagImporto') ? num(t.value) : t.value;
    touch(p);
    if (f === 'pagImporto') updTotals();
    if (['nome', 'telefono', 'via', 'civico', 'comune'].indexOf(f) >= 0) { rubricaPut(s); patchCard(s.id); }
    else if (['orario', 'lavorazione'].indexOf(f) >= 0) patchCard(s.id);
  });
  $('#file').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) handleFile(f); });

  /* ---------- PDF: stessa impostazione del planning originale ---------- */
  async function exportPdf(p) {
    if (!p) return;
    var dl = await cap('downloads'), J = window.jspdf && window.jspdf.jsPDF;
    if (!dl || !J) { note('Il download del PDF non è disponibile in questa vista.', true); return; }
    try {
      var doc = new J({ unit: 'pt', format: 'a4' });
      var X = 19.7, BW = 558, BH = 170, PITCH = 183.5, Y0 = 19.7, PER = 4;
      var clean = function (t) { return String(t == null ? '' : t).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/€/g, 'EUR').replace(/\s+/g, ' ').trim(); };
      var money = function (n) { return (n || 0).toFixed(2).replace('.', ',') + ' EUR'; };
      var txt = function (t, x, y, size, bold, opt) { doc.setFont('times', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.text(clean(t), x, y, opt); };
      var rich = function (text, x, y, w, lh, size, maxLines) {
        doc.setFontSize(size);
        var words = [];
        clean(text).split(/(Contratto prezzo:|Cod\. Impianto:)/).forEach(function (seg, i) { seg.split(' ').forEach(function (wd) { if (wd) words.push({ w: wd, b: i % 2 === 1 }); }); });
        var line = [], lw = 0, ly = y, n = 0;
        var flush = function () { var cx = x; line.forEach(function (t) { doc.setFont('times', t.b ? 'bold' : 'normal'); doc.text(t.w, cx, ly); cx += doc.getTextWidth(t.w + ' '); }); ly += lh; line = []; lw = 0; n++; };
        words.forEach(function (t) {
          if (n >= maxLines) return;
          doc.setFont('times', t.b ? 'bold' : 'normal');
          var tw = doc.getTextWidth(t.w + ' ');
          if (lw + tw > w && line.length) { flush(); if (n >= maxLines) return; }
          line.push(t); lw += tw;
        });
        if (line.length && n < maxLines) flush();
      };
      var dateIt = p.date.split('-').reverse().join('-');
      var cols = [0, 112, 222, 336, 448], labels = ['', 'DATA', 'TECNICO', 'PROGRAMMAZIONE', 'RIC. FISC.'];
      p.schede.forEach(function (s, i) {
        var k = i % PER; if (i && k === 0) doc.addPage();
        var y = Y0 + k * PITCH;
        doc.setTextColor(0); doc.setDrawColor(120); doc.setLineWidth(0.6);
        doc.rect(X, y, BW, BH);
        doc.line(X, y + 25, X + BW, y + 25);
        for (var c = 1; c < 5; c++) doc.line(X + cols[c], y, X + cols[c], y + 25);
        doc.line(X + 280, y + 25, X + 280, y + BH);
        for (var c2 = 1; c2 < 5; c2++) { doc.setTextColor(90); txt(labels[c2], X + cols[c2] + 2, y + 7, 6, false); }
        doc.setTextColor(0);
        var ends = cols.concat([BW]), mid = function (c) { return X + (ends[c] + ends[c + 1]) / 2; };
        txt(s.azienda || '', mid(0), y + 17, 11.5, false, { align: 'center' });
        txt(dateIt, mid(1), y + 19, 12, false, { align: 'center' });
        txt(s.tecnico || '', mid(2) + 12, y + 19, 12, false, { align: 'center' });
        txt(s.orario || '', mid(3), y + 19, 10.5, false, { align: 'center' });
        var pay = s.annullata ? '' : s.pag === 'pos' ? 'POS ' + money(s.pagImporto) : s.pag === 'contanti' ? 'CONTANTI ' + money(s.pagImporto) : '';
        if (pay) txt(pay, mid(4), y + 19, 9, true, { align: 'center' });
        var lx = X + 8, rx = X + 292;
        txt(s.nome, lx, y + 40, 10.5, false);
        txt((s.via + ' ' + (s.civico || '')).trim(), lx, y + 72, 10.5, false);
        txt("CITTA': " + (s.comune || ''), lx, y + 103, 10.5, false);
        txt('TEL:', lx, y + 127, 10.5, false); txt(s.telefono, lx + 40, y + 127, 10.5, false);
        var nt = 'NOTE:' + (s.notaOrig || '');
        rich(nt, lx, y + 151, 262, 10, 10, 2);
        txt('APPARECCHIO: ' + (s.caldaia || ''), rx, y + 40, 10.5, false);
        txt('DESCRIZIONE:', rx, y + 68, 10.5, false);
        var ty = y + 86.5;
        if (s.lavorazione) { doc.setFont('times', 'bold'); doc.setFontSize(10.5); doc.splitTextToSize(clean(s.lavorazione), 258).slice(0, 2).forEach(function (ln) { doc.text(ln, rx, ty); ty += 12; }); }
        if (s.dettagli) { doc.setFont('times', 'normal'); doc.setFontSize(10.5); doc.splitTextToSize(clean(s.dettagli), 258).slice(0, 3).forEach(function (ln) { if (ty < y + BH - 4) doc.text(ln, rx, ty); ty += 12; }); }
        if (s.note) {
          var room = Math.max(1, Math.floor((y + BH - 24 - ty) / 11.5));
          doc.setFont('times', 'bold'); doc.setFontSize(10.5);
          doc.splitTextToSize((s.annullata ? 'MOTIVO: ' : 'NOTE: ') + clean(s.note), 258).slice(0, room).forEach(function (ln) { doc.text(ln, rx, ty + 4); ty += 11.5; });
        }
        if (!s.annullata && s.pag) txt('PAGATO ' + (s.pag === 'pos' ? 'CON POS' : 'IN CONTANTI') + ': ' + money(s.pagImporto), rx, y + BH - 9, 11, true);
        if (s.annullata) {
          doc.setTextColor(212, 42, 28); txt('ANNULLATA DA UFFICIO', X + BW / 2 - 70, y + BH / 2 + 30, 26, true, { angle: 10 }); doc.setTextColor(0);
        }
      });
      var t = totals(p), last = (p.schede.length - 1) % PER, ty2 = Y0 + (last + 1) * PITCH + 4;
      if (ty2 > 790) { doc.addPage(); ty2 = Y0 + 10; }
      txt('Totale contanti: ' + money(t.cash), X, ty2 + 8, 11, true);
      txt('Totale POS/Bancomat: ' + money(t.pos), X, ty2 + 22, 11, true);
      txt('Totale incassato: ' + money(t.cash + t.pos), X, ty2 + 36, 11, true);
      await dl.save({ filename: 'Planning-' + dateIt + '.pdf', data: doc.output('arraybuffer') });
      note('PDF pronto. Dal menu che si apre scegli Stampa e la stampante, oppure apri il file e stampalo da lì.');
    } catch (e) {
      if (!(e && e.code === 'declined')) note('Non sono riuscito a creare il PDF.', true);
    }
  }

  /* ---------- avvio ---------- */
  var splash = $('#splash'), sTimer;
  var hideSplash = function () { clearTimeout(sTimer); splash.classList.add('out'); setTimeout(function () { splash.hidden = true; }, 500); };
  splash.addEventListener('click', hideSplash);
  sTimer = setTimeout(hideSplash, 2200);
  render();
  (async function () {
    await initStore();
    S.ready = true; render();
    checkAlarms(); setInterval(checkAlarms, 15000);
    setInterval(function () { if (S.mode === 'db' && Object.keys(pend).length && !Object.keys(inflight).length) flushAll(); }, 20000);
    sampleFn = await cap('sample');
    if (sampleFn) { try { var lim = await sampleFn.limits(); imgMax = (lim && lim.images && lim.images.maxCount) || 0; } catch (e) { imgMax = 0; } }
    dict = await cap('dictation');
    if (dict) {
      try {
        dict.onState(function (st) { dictOn = st.state === 'listening'; if (!dictOn && st.state === 'idle') { } var b = document.querySelector('.mic'); document.querySelectorAll('.mic').forEach(function (m) { m.classList.toggle('on', dictOn && m.dataset.sid === dictTarget); }); });
        dict.onFinal(function (r) {
          var p = current(), s = dictTarget && findS(dictTarget); if (!s || !p || !r.text) return;
          s.note = (s.note ? s.note + ' ' : '') + r.text; touch(p);
          var el = document.getElementById('f-' + s.id + '-note'); if (el) el.value = s.note;
        });
      } catch (e) { dict = null; }
    }
    render();
  })();
})();
</script>
